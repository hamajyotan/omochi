# SQLite configuration for omochi.
#
# Application state (primary) and Solid Queue (queue) live in separate SQLite
# files. See docs/decisions/0003-solid-queue-separate-database.md.
#
# Rails' SQLite adapter enables WAL journal mode and synchronous=NORMAL by
# default. `timeout` is used as SQLite's busy_timeout (ms) so that concurrent
# writers from web / worker processes wait instead of failing immediately.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("OMOCHI_STORAGE_DIR", "storage") %>/production.sqlite3
  queue:
    <<: *default
    database: <%= ENV.fetch("OMOCHI_STORAGE_DIR", "storage") %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("OMOCHI_STORAGE_DIR", "storage") %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
